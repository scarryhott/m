name: BTC recursive closure thorough backtest

on:
  push:
    branches:
      - btc-tick-live-20260726
    paths:
      - research/btc_recursive_backtest.py
      - research/btc_recursive_backtest_fast.py
      - research/btc_recursive_backtest_corrected.py
      - .github/workflows/btc_recursive_backtest.yml
  pull_request:
    branches:
      - main
    paths:
      - research/btc_recursive_backtest.py
      - research/btc_recursive_backtest_fast.py
      - research/btc_recursive_backtest_corrected.py
      - .github/workflows/btc_recursive_backtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thorough-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.3.2

      - name: Verify syntax
        run: python -m py_compile research/btc_recursive_backtest.py research/btc_recursive_backtest_corrected.py

      - name: Run corrected five-year walk-forward backtest
        run: |
          mkdir -p results/thorough_backtest
          python research/btc_recursive_backtest_corrected.py | tee results/thorough_backtest/console-summary.json

      - name: Package report
        run: |
          cp research/btc_recursive_backtest.py research/btc_recursive_backtest_fast.py research/btc_recursive_backtest_corrected.py results/thorough_backtest/
          cd results
          zip -r btc-recursive-thorough-backtest.zip thorough_backtest

      - name: Upload thorough report
        uses: actions/upload-artifact@v4
        with:
          name: btc-recursive-thorough-backtest-corrected
          path: |
            results/thorough_backtest
            results/btc-recursive-thorough-backtest.zip
          if-no-files-found: error
          retention-days: 14
